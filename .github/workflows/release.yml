name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # The asset name is "legio-$(uname -s)-$(uname -m)", so the
          # install command can find its file with uname.
          - { os: macos-latest, target: aarch64-apple-darwin, asset: legio-Darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: legio-Darwin-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: legio-Linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: legio-Linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}
      - run: tar -czf ${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release legio
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum legio-*.tar.gz > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" legio-*.tar.gz SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
