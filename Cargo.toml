[package]
name = "legio-cli"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "legio"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
hmac = "0.13.0"
qrcode = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny_http = "0.12.0"
ureq = { version = "3.4.2", features = ["json"] }
